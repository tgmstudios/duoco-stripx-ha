name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (versions the tests were run against)
        run: |
          python -m pip install --upgrade pip
          pip install pytest-homeassistant-custom-component==0.13.316
      - name: Run tests
        run: python -m pytest tests -q -W error::RuntimeWarning
